<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cam-01 / cam-02</title>
<style>
  body { font-family: sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  #login, #app { display: none; }
  input { display: block; margin: 0.5rem 0; padding: 0.5rem; width: 100%; box-sizing: border-box; }
  button { padding: 0.5rem 1rem; margin-right: 0.5rem; }
  .status { color: #666; font-size: 0.9rem; }
  /* Audio gets its own small panel: the two settings in it mean different things (one
     changes the stream for everyone, one only changes this browser) and sitting them
     loose among the buttons made that unreadable. */
  .setting-section {
    margin: 1rem 0; padding: 0.55rem 0.85rem;
    border: 1px solid #e0e0e0; border-radius: 6px; background: #fafafa;
  }
  .setting-section h3 { margin: 0 0 0.35rem; font-size: 0.95rem; }
  .audio-row {
    display: flex; align-items: baseline; gap: 0.45rem;
    margin: 0.25rem 0; cursor: pointer; line-height: 1.35; font-size: 0.9rem;
  }
  /* The global `input` rule above is written for the login form -- display:block,
     width:100%, padding. Applied to a checkbox it makes the box fill the whole row and
     pushes the label clean out of the panel, so every part of it has to be undone here
     explicitly; `flex: none` alone does not do it. */
  .audio-row input[type="checkbox"] {
    display: inline-block; width: auto; margin: 0; padding: 0;
    flex: none; position: relative; top: 2px;
  }
  .audio-row small { color: #666; }
  .audio-row.disabled { opacity: 0.55; cursor: default; }
  .setting-section > .status { margin: 0.4rem 0 0; }
  /* A <select> is not caught by the global `input` rule, but give it an explicit width
     anyway so it cannot inherit a full-row width from anything added later. */
  .setting-row { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap;
                 font-size: 0.9rem; margin: 0.15rem 0 0.35rem; }
  .setting-row select { width: auto; padding: 0.2rem 0.35rem; font-size: 0.9rem; margin: 0; }
  .setting-note { color: #666; font-size: 0.82rem; line-height: 1.4; }
  .video-wrap { position: relative; background: #000; aspect-ratio: 16 / 9; }
  video { display: block; width: 100%; height: 100%; }
  .overlay {
    position: absolute; inset: 0; background: #000; color: #ddd;
    display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 1.5rem; box-sizing: border-box; font-size: 1rem;
    white-space: pre-line;
  }
  .overlay.hidden { display: none; }

  .camera-panel { margin-bottom: 3rem; padding-bottom: 1rem; border-bottom: 2px solid #ddd; }
  .camera-panel h2 { margin-bottom: 0.25rem; }
  .camera-subtitle { color: #888; font-size: 0.85rem; margin-top: 0; margin-bottom: 1rem; }

  .clips-section { margin-top: 1.5rem; }
  .clips-list { list-style: none; padding: 0; }
  .clips-list li {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.5rem 0; border-bottom: 1px solid #eee;
  }
  .tier-badge {
    font-size: 0.75rem; padding: 0.15rem 0.5rem; border-radius: 1rem;
    color: #fff; white-space: nowrap;
  }
  .tier-STANDARD { background: #2a7d2a; }
  .tier-STANDARD_IA { background: #b8860b; }
  .tier-DEEP_ARCHIVE, .tier-GLACIER { background: #444; }
  .tier-UNKNOWN { background: #999; }
  .clip-meta { flex: 1; font-size: 0.9rem; min-width: 10rem; }
  .clip-labels { color: #888; font-size: 0.8rem; }
  .clip-duration { color: #888; font-size: 0.85rem; }
  .clip-codec-warn { color: #8a5a00; font-weight: 600; cursor: help; }
  .tier-apply-status { font-size: 0.8rem; color: #888; }
  .trigger-note { color: #666; font-size: 0.8rem; margin: -0.4rem 0 0.8rem; }
  .camera-panel h2 .cam-id { color: #888; font-size: 0.9rem; font-weight: normal; margin-left: 0.4rem; }
  .clips-pager { display: flex; align-items: center; flex-wrap: wrap; gap: 0.25rem; margin-top: 0.6rem; }
  .clips-pager.hidden { display: none; }
  .clips-pager button { font-size: 0.8rem; padding: 0.3rem 0.7rem; margin-right: 0; }
  .clips-pager .pg-numbers { display: contents; }
  .clips-pager .pg-num { min-width: 2.2rem; padding: 0.3rem 0.4rem; }
  .clips-pager .pg-num.pg-current:disabled { background: #333; color: #fff; border-color: #333; font-weight: 600; }
  .clips-pager .pg-gap { color: #888; padding: 0 0.2rem; }
  .clips-page-label { color: #888; font-size: 0.85rem; margin: 0 0.5rem; }
  .clips-alert {
    display: none;                 /* only present when there is something to say */
    margin: 0.6rem 0;
    padding: 0.6rem 0.85rem;
    border: 1px solid #c0392b;
    border-left: 5px solid #c0392b;
    border-radius: 4px;
    background: #fdecea;
    color: #c0392b;
    font-size: 0.9rem;
    font-weight: 600;
  }
  /* This browser can't decode H.265. Amber, not the red of .clips-alert: nothing is wrong
     with the camera or the cloud -- the fix is on the viewer's machine. */
  .browser-note {
    display: none;                 /* shown by showHevcHelp() only when it applies */
    margin: 0 0 1.5rem;
    padding: 0.6rem 0.85rem;
    border: 1px solid #d4a017;
    border-left: 5px solid #d4a017;
    border-radius: 4px;
    background: #fff8e1;
    color: #5c4400;
    font-size: 0.9rem;
    line-height: 1.45;
  }
  .browser-note strong { display: block; margin-bottom: 0.2rem; }
  .codec-warn { color: #8a5a00; font-size: 0.85rem; margin: -0.6rem 0 0.9rem; }
</style>
</head>
<body>

<div id="login">
  <h3>Sign in</h3>
  <input id="username" placeholder="username" autocomplete="username">
  <input id="password" type="password" placeholder="password" autocomplete="current-password">
  <button onclick="login()">Sign in</button>
  <div id="loginError" style="color:red"></div>
</div>

<div id="app">
  <!-- One .camera-panel block per camera, generated by renderCameraPanel() below --
       kept as a JS template rather than duplicated static HTML, since every function
       (load/cmd/record/clips) is parameterized by camera and would otherwise need a
       hand-maintained duplicate set of element IDs per camera. -->
  <div id="hevcNote" class="browser-note"></div>
  <div id="cameras"></div>

  <div id="clipPlayerSection" style="display:none">
    <h3>Clip player</h3>
    <video id="clipPlayer" controls muted style="width:100%; background:#000"></video>
    <p><button onclick="closeClipPlayer()">Stop &amp; close player</button></p>
    <div id="clipStatus" class="status"></div>
  </div>
</div>

<!-- Pinned: @latest can change under the page without a deploy (FoundAndFixed.md #66). -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.7.3"></script>
<script>
const API = "https://svfvg7xh9g.execute-api.eu-central-1.amazonaws.com/prod";
const COGNITO_REGION = "eu-central-1";
const COGNITO_CLIENT_ID = "1r0n2cor1pgqvahfogs6cfno7s";

// Fetched from GET /cameras (backed by the "cameras" DynamoDB registry) after login,
// rather than hardcoded here -- a camera added through the registry shows up on next
// login with no client redeploy. "id" matches the KVS stream name / cameraId / systemd
// unit suffix (kvs-cam01.service etc, see agent.py's hyphen-stripping note) used
// throughout the backend.
let CAMERAS = [];

let idToken = null;
// Per-camera player/recording state, keyed by camera id -- populated once CAMERAS is
// fetched (see login()), since it used to be a handful of bare global variables back
// when this page only had one hardcoded camera.
const state = {};

// Evidence clips are listed a page at a time, newest first (loadClips()).
const CLIPS_PAGE_SIZE = 10;

function el(camera, base) { return document.getElementById(`${base}-${camera}`); }
function setStatus(camera, msg) { el(camera, "status").textContent = msg; }
function showOverlay(camera, msg) {
  const o = el(camera, "overlay");
  o.textContent = msg;
  o.classList.remove("hidden");
}
function hideOverlay(camera) { el(camera, "overlay").classList.add("hidden"); }

// Whether this browser can decode H.265 is asked of the browser at runtime, never guessed
// from the user agent: it depends on the browser AND the machine. On one Windows PC only
// Chrome played H.265 while Firefox and Edge could not until Microsoft's "HEVC Video
// Extensions" were installed; on another PC that had them, all three did
// (measurements/codec-phase0.md §7). The probe string is the CODECS value KVS advertises.
const HEVC_TYPE = 'video/mp4; codecs="hvc1.1.6.L90.0"';
const HEVC_STORE_URL = "https://apps.microsoft.com/detail/9nmzlz57r3t7";

function hevcSupport() {
  const MS = window.ManagedMediaSource || window.MediaSource;
  const mse = !!(MS && MS.isTypeSupported(HEVC_TYPE));
  const file = document.createElement("video").canPlayType(HEVC_TYPE) !== "";
  // Live view goes through hls.js (MSE) wherever that is available, as load() does;
  // clips are plain MP4 in a <video> element.
  return { live: (window.Hls && Hls.isSupported()) ? mse : file, clips: file };
}

function hevcHelpHtml() {
  if (/Windows/.test(navigator.userAgent)) {
    return `On Windows, install Microsoft's <a href="${HEVC_STORE_URL}" target="_blank" ` +
      `rel="noopener">HEVC Video Extensions</a> (German Windows: „HEVC-Videoerweiterungen“) ` +
      `from the Microsoft Store, then restart the browser — Firefox and Edge need it to ` +
      `decode H.265. Cameras recording in H.264 are not affected.`;
  }
  return `Open this page in a browser or on a device that can decode H.265 (HEVC). ` +
    `Cameras recording in H.264 are not affected.`;
}

// The camera's video codec as the registry reports it (GET /cameras). Display only: the
// codec is set on the camera itself, from the local admin GUI -- there is no cloud control.
const CODEC_NAMES = { h264: "H.264", h265: "H.265" };

// " · H.265" for a clip line (after the duration). The codec is read from the clip file
// itself when the clip is made, so both halves of a clip split at a codec switch are
// labelled correctly. An H.265 clip this browser can't decode is flagged right here,
// before anyone presses Play.
function clipCodecHtml(clip) {
  const name = CODEC_NAMES[clip.videoCodec];
  if (!name) return "";
  if (clip.videoCodec === "h265" && !hevcSupport().clips) {
    return ` · <span class="clip-codec-warn" title="This browser can't decode H.265 — see the note at the top of the page">${name}</span>`;
  }
  return ` · ${name}`;
}

function codecLabel(cam) {
  const name = CODEC_NAMES[cam.videoCodec] || "H.264";
  const where = { camera: "camera encoder", "pi-hw": "adapter hardware encoder" }[cam.videoEncode];
  return `video ${name}${where ? ` (${where})` : ""}`;
}

// A camera's display name, set in the local admin page (displayName from GET /cameras). It is
// the one free text a person types that this page shows, so it is escaped. The server allows only
// letters, digits, space, - _ . anyway.
const esc = v => String(v ?? "").replace(/[&<>"']/g,
  ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
function camHeading(cam) {
  return cam.displayName ? `${esc(cam.displayName)}<span class="cam-id">${esc(cam.id)}</span>` : esc(cam.id);
}
const camLabel = cam => cam.displayName ? `${cam.displayName} (${cam.id})` : cam.id;

// Grey out the detection modes a camera's ONVIF event list doesn't support (FoundAndFixed.md
// #65): choosing one would subscribe to events the camera never sends. `modes` null = not known.
function limitModes(sel, modes) {
  if (!sel || !Array.isArray(modes)) return;
  for (const opt of sel.options) {
    if (opt.value === "manual") continue;
    const ok = modes.includes(opt.value);
    opt.disabled = !ok;
    opt.title = ok ? "" : "this camera doesn't publish the events for this mode";
  }
}

// Detection triggers may need switching on in the camera's own settings (FoundAndFixed.md #65);
// its page is a LAN address, so the link works only from home. Tests run from the local admin
// page, and their outcome arrives here through GET /cameras (detectionTests).
const MODE_NAMES = { motion: "Motion", cellMotion: "Cell grid", human: "Human" };
function triggerNoteCloud(cam) {
  const u = typeof cam.webUrl === "string" && /^http:\/\/[A-Za-z0-9.-]+(:\d+)?\/$/.test(cam.webUrl) ? cam.webUrl : null;
  const tests = cam.detectionTests || {};
  const done = Object.keys(MODE_NAMES).filter(m => tests[m]).map(m =>
    `${MODE_NAMES[m]} ${tests[m].result === "seen" ? "✓" : "✗"} ${esc(new Date(tests[m].at).toLocaleDateString())}`);
  return "Some triggers fire only after they are switched on in the camera's own settings"
    + (u ? ` (<a href="${u}" target="_blank" rel="noopener">open</a>, home network only)` : "")
    + ". Test them with \"Test triggers\" in the local admin page."
    + (done.length ? ` Last test: ${done.join(" · ")}.` : "");
}

function showHevcHelp() {
  const n = document.getElementById("hevcNote");
  n.innerHTML = `<strong>This browser can't play H.265 video.</strong>${hevcHelpHtml()}`;
  n.style.display = "block";
}

function teardownPlayer(camera) {
  const s = state[camera];
  clearTimeout(s.refreshTimer);
  s.refreshTimer = null;
  clearInterval(s.stallTimer);
  s.stallTimer = null;
  if (s.hls) { s.hls.destroy(); s.hls = null; }
  const v = el(camera, "video");
  v.onvolumechange = null;        // or it fires during load() and rewrites s.listen
  v.removeAttribute("src");
  v.load();
  // Stopping leaves nothing to listen to. s.listen is deliberately NOT cleared -- it is
  // the user's standing preference and is reapplied when a stream with sound comes back.
  setListenAvailable(camera, false);
}

// A KVS HLS session URL dies at `expires_in` seconds and cannot be revived -- every
// later request against it 403s. Refresh at 80% of that so a fresh session is playing
// before the old URL lapses. Without this the player ends up retrying a permanently
// dead URL: hls.js keeps failing, the <video> element sits in a "waiting" state, and
// the browser shows its own spinner forever while the last buffered seconds play out.
function scheduleSessionRefresh(camera, expiresIn) {
  const s = state[camera];
  clearTimeout(s.refreshTimer);
  const ms = Math.max(30, Math.floor((expiresIn || 300) * 0.8)) * 1000;
  s.refreshTimer = setTimeout(() => { if (!s.userStopped) load(camera); }, ms);
}

// One place for the mode wording, so the initial render and the post-save message can't
// drift apart. The stream caveat matters: the event watcher publishes a clip trigger on
// detection, but clip_to_s3 pulls from KVS, which only has footage while the producer is
// running -- a detection with the stream stopped produces nothing.
function recModeHint(mode, supportsDetection) {
  if (!supportsDetection) return "no ONVIF — manual only";
  if (!mode || mode === "manual") return "manual only — use Start Recording";
  return `${mode} detection armed — a clip is written ~40 s after a detection (post-roll + processing), then announced below within 30 s. Requires the stream to be running.`;
}

// One place for the audio wording, same reasoning as recModeHint(). The "next Start"
// caveat is not a UI nicety and must not be softened: the producer reads audioEnabled
// once at startup and never re-reads, because KVS rejects a stream whose fragments
// change from video-only to audio+video mid-stream ("Track changes aren't supported" --
// GetClip and GetHLSStreamingSessionURL both). Applying this live would break clips
// across the boundary, so a restart is the correct behaviour, not a limitation.
// Must stay in step with VALID_LIMITS in set_camera_outage_buffer.py and
// adapter/outage_buffer.py. The disk figures are for cam-01 with audio (the expensive
// case, ~1.26 Mbps measured) and are shown because 24 h is 13.6 GB of a 57 GB stick --
// a number worth seeing before choosing it, not after.
const OUTAGE_LIMITS = [
  { sec: 0,     label: "Off" },
  { sec: 30,    label: "30 seconds" },
  { sec: 120,   label: "2 minutes" },
  { sec: 300,   label: "5 minutes" },
  { sec: 600,   label: "10 minutes" },
  { sec: 1800,  label: "30 minutes" },
  { sec: 3600,  label: "1 hour  (~570 MB)" },
  { sec: 18000, label: "5 hours  (~2.8 GB)" },
  { sec: 43200, label: "12 hours  (~6.8 GB)" },
  { sec: 86400, label: "24 hours  (~13.6 GB)" },
];

// Evidence clips are 45s and read fine as "45 sec.". Outage-buffer chunks run to 2 hours,
// which rendered as "7200 sec." -- technically correct and unreadable.
function formatDuration(sec) {
  sec = Number(sec);
  if (sec < 90) return `${sec} sec.`;
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60);
  if (!h) return `${m} min.`;
  return m ? `${h} h ${m} min.` : `${h} h`;
}

function outageLabel(sec) {
  const m = OUTAGE_LIMITS.find(o => o.sec === Number(sec));
  return m ? m.label.replace(/\s*\(.*\)$/, "") : `${sec}s`;
}

function outageHint(sec) {
  if (!Number(sec)) return "off — footage is lost if the connection drops for more than ~2 minutes";
  return `on — up to ${outageLabel(sec)} after a drop, plus the 2 minutes before it`;
}

function audioHint(enabled, capable) {
  if (!capable) return "this camera has no microphone";
  return enabled
    ? "microphone is included — you can hear it live and in clips"
    : "video only — no microphone in the live view or in clips";
}

// "Include microphone" and "Listen here" are deliberately two controls, because they are
// two different things and conflating them confuses people:
//
//   Include microphone -> whether audio exists in the KVS stream at all. Affects the live
//                         view AND every clip. Costs bandwidth. Applies on next Start.
//   Listen here        -> whether THIS browser plays that audio out loud. Local only,
//                         instant, affects nobody else, costs nothing.
//
// The second is useless without the first, so it stays disabled until the player reports
// an audio track actually present in the stream it is playing.
function setListenAvailable(camera, available) {
  const box = document.getElementById(`listen-${camera}`);
  const lbl = document.getElementById(`listenLabel-${camera}`);
  const hint = document.getElementById(`listenHint-${camera}`);
  if (!box || !lbl) return;
  box.disabled = !available;
  lbl.classList.toggle("disabled", !available);
  if (hint) {
    hint.textContent = available
      ? "— your speakers only; changes nothing for anyone else"
      : "— no sound in this stream · tick Record microphone, then Stop and Start";
  }
  if (!available) { box.checked = false; return; }
  // Restore the choice across a session refresh: load() re-attaches the player roughly
  // hourly (scheduleSessionRefresh), and silently re-muting each time would look like
  // the audio had cut out.
  const s = state[camera];
  if (s && s.listen) { box.checked = true; setListen(camera, true); }
}

function setListen(camera, on) {
  const v = el(camera, "video");
  const s = state[camera];
  if (!v) return;
  // Browsers block unmuted autoplay, which is why the player starts muted. Unmuting from
  // inside a change handler is fine: the click is the user gesture that permits it.
  v.muted = !on;
  if (on && v.paused) v.play().catch(() => {});
  if (s) s.listen = on;   // survives the session-refresh reload (see load())
}

// Detection-created clips arrive without the page doing anything, so unlike manual
// recording there is no local event to refresh the list on. Poll only to *notice* them
// and raise a hint -- deliberately not reloading the list underneath the user, which
// would reset a tier dropdown or a scroll position mid-interaction.
function syncClipPolling(camera, mode) {
  const s = state[camera];
  if (!s) return;
  clearInterval(s.clipsTimer);
  s.clipsTimer = null;
  if (mode && mode !== "manual") {
    s.clipsTimer = setInterval(() => checkForNewClips(camera), 30000);
  }
}

// Compares the newest clip on the server against the newest one currently rendered.
async function checkForNewClips(camera) {
  const s = state[camera];
  const alertEl = document.getElementById(`clipsAlert-${camera}`);
  if (!s || !alertEl) return;
  try {
    // limit=1: only the newest clip matters here -- one read and one S3 HEAD per poll
    const r = await fetch(`${API}/clips?camera=${camera}&limit=1`, { headers: { Authorization: idToken } });
    if (!r.ok) return;
    const data = await r.json();
    const newest = data.clips.length ? data.clips[0].startTs : null;
    // renderedLatest === null means the rendered list was empty, so the first clip to
    // arrive is still news -- don't require a previous value
    if (newest && newest !== s.renderedLatest) {
      alertEl.textContent = "New clips are available. Refresh to watch.";
      alertEl.style.display = "block";
    }
  } catch (e) { /* transient; the next tick retries */ }
}

function renderCameraPanel(cam) {
  const div = document.createElement("div");
  div.className = "camera-panel";
  const modeLabel = cam.mode === "passthrough" ? "ONVIF, passthrough" : "USB, transcoded";
  div.innerHTML = `
    <h2>${camHeading(cam)}</h2>
    <p class="camera-subtitle">${modeLabel} · <span title="Set on the camera, in the local admin GUI">${codecLabel(cam)}</span>${cam.hasIrControl ? " · IR control" : ""}</p>
    ${cam.videoCodec === "h265" && !hevcSupport().live
      ? `<p class="codec-warn">This browser can't play H.265 video — live view and clips of this camera won't show here. See the note at the top of the page.</p>`
      : ""}
    ${cam.liveView === "sub" && cam.liveVideoCodec === "h265" && cam.videoCodec !== "h265" && !hevcSupport().live
      ? `<p class="codec-warn">This camera's live view (its sub stream) is H.265, which this browser can't play — Live won't show here, recordings will. See the note at the top of the page.</p>`
      : ""}
    <div class="video-wrap">
      <video id="video-${cam.id}" controls autoplay muted playsinline></video>
      <div id="overlay-${cam.id}" class="overlay">Press Live to watch, or Start to record to the cloud</div>
    </div>
    <p>
      <!-- Live = watch, Start = record (VMS-PORT-PLAN.md D3). Live costs only while this page
           shows it, and the Pi ends it by itself a few minutes after the page stops asking. -->
      <button id="liveBtn-${cam.id}" onclick="liveToggle('${cam.id}')"
              title="Watch ${cam.liveView === "sub" ? "the camera's sub stream" : "the camera"} without recording. Stops by itself a few minutes after you leave.">&#9654; Live</button>
      <button onclick="cmd('${cam.id}','start')" title="Push this camera to the cloud archive -- needed for clips. Costs while it runs: press Stop when done.">Start</button>
      <button onclick="cmd('${cam.id}','stop')" title="Stop pushing to the cloud archive">Stop</button>
      <button onclick="state['${cam.id}'].stallReloads = 0; load('${cam.id}')">Reload player</button>
    </p>
    <div id="status-${cam.id}" class="status"></div>

    ${cam.hasIrControl ? `
    <p>
      IR illumination:
      <!-- ONVIF IrCutFilter: ON = the IR-cut filter is in (day: colour, IR LEDs off), OFF = it is
           out (night: black-and-white, IR on). These labels had it the other way round
           (FoundAndFixed.md #64). -->
      <button onclick="setIrMode('${cam.id}','AUTO')">Auto</button>
      <button onclick="setIrMode('${cam.id}','ON')">Force Day (colour, IR off)</button>
      <button onclick="setIrMode('${cam.id}','OFF')">Force Night (B/W, IR on)</button>
      <span id="irStatus-${cam.id}" class="status"></span>
    </p>` : ""}

    <p>
      Recording mode:
      <select id="recMode-${cam.id}" onchange="setRecordingMode('${cam.id}', this.value)"
              ${cam.supportsDetection ? "" : "disabled"}>
        <option value="manual">Manual only</option>
        <option value="motion">Motion detected</option>
        <option value="cellMotion">Motion in zones (cell grid)</option>
        <option value="human">Human detected</option>
      </select>
      <span id="recModeStatus-${cam.id}" class="status">${recModeHint(cam.recordingMode, cam.supportsDetection)}</span>
    </p>
    ${cam.supportsDetection ? `<p class="trigger-note">${triggerNoteCloud(cam)}</p>` : ""}

    <div class="setting-section">
      <h3>Audio</h3>

      <label class="audio-row ${cam.audioCapable ? "" : "disabled"}" id="audioLabel-${cam.id}">
        <input type="checkbox" id="audio-${cam.id}"
               onchange="setAudio('${cam.id}', this.checked)"
               ${cam.audioCapable ? "" : "disabled"}>
        <span><strong>Record microphone</strong> <small>${cam.audioCapable
          ? "— into the live view and clips, for everyone · applies on next Start"
          : "— this camera has no microphone"}</small></span>
      </label>

      <label class="audio-row disabled" id="listenLabel-${cam.id}">
        <input type="checkbox" id="listen-${cam.id}"
               onchange="setListen('${cam.id}', this.checked)" disabled>
        <span><strong>Play sound here</strong> <small id="listenHint-${cam.id}">— needs a running stream that has sound</small></span>
      </label>

      <div id="audioStatus-${cam.id}" class="status">${audioHint(cam.audioEnabled, cam.audioCapable)}</div>
    </div>

    <div class="setting-section">
      <h3>If the internet drops</h3>
      <div class="setting-row">
        <label for="outage-${cam.id}">Keep recording locally for</label>
        <select id="outage-${cam.id}" onchange="setOutageBuffer('${cam.id}', this.value)">
          ${OUTAGE_LIMITS.map(o => `<option value="${o.sec}">${o.label}</option>`).join("")}
        </select>
      </div>
      <div class="setting-note">
        Footage is buffered to the USB drive while AWS is unreachable, then uploaded to
        <em>Evidence clips</em> when the connection returns. The <strong>2 minutes before
        the drop</strong> are always included on top of the time you choose. Only runs
        while this camera is streaming.
      </div>
      <div id="outageStatus-${cam.id}" class="status">${outageHint(cam.outageBufferSec)}</div>
    </div>

    <p>
      <!-- Off until footage is reaching the cloud archive: see setArchiving(). -->
      <button id="recordBtn-${cam.id}" onclick="toggleRecording('${cam.id}')" disabled>&#9679; Start Recording</button>
      <span id="recordHint-${cam.id}" class="status">Press Start first — the clip is cut from the cloud recording, which only exists while Start runs.</span>
      <span id="recordStatus-${cam.id}" class="status"></span>
    </p>

    <div class="clips-section">
      <h3>Evidence clips
        <button onclick="loadClips('${cam.id}', 'first')" style="font-size:0.8rem">Refresh</button>
      </h3>
      <div id="clipsAlert-${cam.id}" class="clips-alert"></div>
      <ul id="clipsList-${cam.id}" class="clips-list"></ul>
      <div id="clipsPager-${cam.id}" class="clips-pager hidden">
        <button class="pg-first" onclick="loadClips('${cam.id}', 'first')">&laquo; Newest</button>
        <button class="pg-newer" onclick="loadClips('${cam.id}', 'newer')">&lsaquo; Newer</button>
        <span class="pg-numbers"></span>
        <button class="pg-older" onclick="loadClips('${cam.id}', 'older')">Older &rsaquo;</button>
        <button class="pg-last" onclick="loadClips('${cam.id}', 'last')">Oldest &raquo;</button>
        <span class="clips-page-label"></span>
      </div>
    </div>`;
  return div;
}

const TIER_LABEL = {
  STANDARD: "Standard", STANDARD_IA: "Standard-IA",
  DEEP_ARCHIVE: "Deep Archive", GLACIER: "Glacier", UNKNOWN: "Unknown",
};

// Cognito's InitiateAuth is a plain JSON HTTPS API -- no SDK needed, keeps this a
// single self-contained file. See: https://docs.aws.amazon.com/cognito/latest/developerguide/API_InitiateAuth.html
async function login() {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const errorEl = document.getElementById("loginError");
  errorEl.textContent = "";
  try {
    const r = await fetch(`https://cognito-idp.${COGNITO_REGION}.amazonaws.com/`, {
      method: "POST",
      headers: {
        "Content-Type": "application/x-amz-json-1.1",
        "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
      },
      body: JSON.stringify({
        AuthFlow: "USER_PASSWORD_AUTH",
        ClientId: COGNITO_CLIENT_ID,
        AuthParameters: { USERNAME: username, PASSWORD: password },
      }),
    });
    const data = await r.json();
    if (!r.ok || !data.AuthenticationResult) {
      errorEl.textContent = data.message || "Sign-in failed";
      return;
    }
    idToken = data.AuthenticationResult.IdToken;

    const camerasDiv = document.getElementById("cameras");
    camerasDiv.innerHTML = "<p>Loading cameras…</p>";
    const cr = await fetch(`${API}/cameras`, { headers: { Authorization: idToken } });
    const cdata = await cr.json();
    if (!cr.ok) {
      errorEl.textContent = "Could not load camera list: " + (cdata.error || cr.status);
      return;
    }
    CAMERAS = cdata.cameras;

    document.getElementById("login").style.display = "none";
    document.getElementById("app").style.display = "block";

    camerasDiv.innerHTML = "";
    for (const cam of CAMERAS) {
      state[cam.id] = { hls: null, userStopped: true, recording: false, recordingStartTs: null,
                        recordingTimer: null, refreshTimer: null, netRetries: 0,
                        clipsTimer: null, renderedLatest: null, listen: false,
                        page: 1, pages: 1, total: 0, pageLoading: false,
                        outageBufferSec: cam.outageBufferSec || 0,
                        // what the player shows: "live" (Live), "recorded" (after Start) or null
                        view: null, liveTimer: null, liveSentAt: 0, stallTimer: null,
                        stallReloads: 0, startedAt: null, liveWaitUntil: 0,
                        // whether footage is reaching the cloud archive (checkArchive)
                        archiving: false, archiveTimer: null, archiveSeq: 0,
                        archiveStartedAt: 0, archiveWaitUntil: 0, archiveStoppedAt: 0 };
      camerasDiv.appendChild(renderCameraPanel(cam));
      checkArchive(cam.id);
      // The <select> is built via innerHTML, so the stored value has to be applied after
      // the node is in the DOM rather than as a `selected` attribute in the template.
      const sel = document.getElementById(`recMode-${cam.id}`);
      if (sel) sel.value = cam.recordingMode || "manual";
      limitModes(sel, cam.detectionModes);
      const aud = document.getElementById(`audio-${cam.id}`);
      if (aud) aud.checked = !!cam.audioEnabled;
      const ob = document.getElementById(`outage-${cam.id}`);
      if (ob) ob.value = String(cam.outageBufferSec || 0);
      syncClipPolling(cam.id, cam.recordingMode);
      loadClips(cam.id, "first");
    }
    // Warn up front, before the viewer meets a black player, once the registry reports a
    // camera recording in H.265 (videoCodec, from the codec-selection work).
    if (CAMERAS.some(c => c.videoCodec === "h265") && !hevcSupport().live) showHevcHelp();
  } catch (e) {
    errorEl.textContent = "Network error: " + e.message;
  }
}

async function load(camera) {
  setStatus(camera, "loading stream...");
  showOverlay(camera, "Loading stream…");
  try {
    const s0 = state[camera];
    // view: Live plays the camera's live view, its own KVS stream "<camera>-live" that the Pi
    // pushes while this page asks for it (liveToggle); after Start the player shows the recorded
    // stream, as it always did. Within the start window, since=<seconds since the button> asks
    // for footage from the new run only: a plain live session right after Stop -> Start is built
    // from the old run's last fragment and then waits for the new one (FoundAndFixed.md #66).
    // Measured on this page's own clock.
    const view = s0.view === "live" ? "live" : "recorded";
    const since = s0.startedAt && Date.now() < (s0.liveWaitUntil || 0)
      ? `&since=${Math.max(1, (performance.now() - s0.startedAt) / 1000).toFixed(1)}` : "";
    const r = await fetch(`${API}/hls?stream=${camera}&view=${view}${since}`, { headers: { Authorization: idToken } });
    const data = await r.json();
    // Right after Start, "not live" (503) is expected, not an error: the producer needs a
    // few seconds to connect, and KVS has nothing until the camera's first keyframe
    // *closes* a fragment. cam-02 sends one every 3 s, so its first fragment lands ~10 s
    // after Start -- a single look at 8 s missed it every time (FoundAndFixed.md #43).
    // Keep asking until the Start window runs out; Stop clears the window.
    if (r.status === 503 && Date.now() < (s0.liveWaitUntil || 0)) {
      setStatus(camera, "waiting for first video...");
      showOverlay(camera, (view === "live" ? "Starting live view…" : "Starting stream…")
                          + "\nWaiting for the first video from the camera.");
      clearTimeout(s0.refreshTimer);
      s0.refreshTimer = setTimeout(() => load(camera), 3000);
      return;
    }
    const waited = !!s0.liveWaitUntil;
    s0.liveWaitUntil = 0;
    s0.startedAt = null;
    if (r.status === 503 && waited) {
      // The whole start window passed without one fragment. The likeliest cause is the command
      // never reaching the Pi -- its MQTT session to AWS was down (FoundAndFixed.md #61) -- so
      // say that rather than a bare "not available".
      setStatus(camera, "no video arrived within 45 s");
      showOverlay(camera, "No video arrived within 45 s.\n\nThe Pi didn't answer: it may be offline " +
                          "from AWS, or the camera unreachable. Try again in a minute.");
      return;
    }
    if (!r.ok) {
      setStatus(camera, "error: " + (data.error || r.status));
      showOverlay(camera, (data.error || "Could not load stream") + "\n\nPress Start to begin.");
      return;
    }
    const { url } = data;
    const v = el(camera, "video");
    const s = state[camera];

    if (s.hls) { s.hls.destroy(); s.hls = null; }
    clearTimeout(s.refreshTimer);
    clearInterval(s.stallTimer);
    s.userStopped = false;
    s.netRetries = 0;

    // Every reload starts muted and unavailable; MANIFEST_PARSED below re-enables it if
    // the stream really does carry sound. Assuming from the registry flag instead would
    // be wrong -- the flag can have been changed since this producer was started.
    v.muted = true;
    setListenAvailable(camera, false);

    if (Hls.isSupported()) {
      s.hls = new Hls();
      s.hls.loadSource(url);
      s.hls.attachMedia(v);
      s.hls.on(Hls.Events.MANIFEST_PARSED, (evt, data) => {
        setListenAvailable(camera, !!(data.audioTracks && data.audioTracks.length));
      });
      s.hls.on(Hls.Events.FRAG_BUFFERED, () => { hideOverlay(camera); s.netRetries = 0; });
      s.hls.on(Hls.Events.ERROR, (evt, data) => {
        if (!data.fatal) return;
        if (s.userStopped) return;
        // The browser refuses the stream's codec outright -- what Firefox and Edge report
        // for H.265 without the HEVC extension. recoverMediaError() cannot supply a
        // missing decoder, so explain it instead of retrying.
        if (data.details === Hls.ErrorDetails.MANIFEST_INCOMPATIBLE_CODECS_ERROR) {
          const hevc = /hvc1|hev1/.test(String(data.reason || "")) || !hevcSupport().live;
          setStatus(camera, "this browser can't decode the stream's video codec");
          showOverlay(camera, hevc
            ? "This browser can't play this camera's H.265 video.\n\nSee the note at the top of the page."
            : "This browser can't decode this camera's video format.");
          if (hevc) showHevcHelp();
          return;
        }
        setStatus(camera, "player error: " + data.details);
        switch (data.type) {
          case Hls.ErrorTypes.NETWORK_ERROR:
            // Usually the KVS session URL having expired, which startLoad() can never
            // fix -- it just re-requests the same dead URL. Allow a couple of retries
            // for genuinely transient blips, then go get a whole new session. The
            // overlay matters too: without it the only feedback is the browser's own
            // spinner, which looks identical to "still buffering".
            // A failed playlist load is different: startLoad() resumes fragment loading and has
            // no playlist to resume, so the player would sit there spinning, never erroring
            // again (FoundAndFixed.md #66). Those go straight to a new session.
            if (!/^(manifest|level)/.test(data.details) && ++s.netRetries <= 2) {
              s.hls.startLoad();
            } else {
              s.netRetries = 0;
              showOverlay(camera, "Reconnecting…");
              clearTimeout(s.refreshTimer);
              s.refreshTimer = setTimeout(() => { if (!s.userStopped) load(camera); }, 1000);
            }
            break;
          case Hls.ErrorTypes.MEDIA_ERROR:
            s.hls.recoverMediaError();
            break;
          default:
            showOverlay(camera, "Playback error (" + data.details + ")\n\nPress Reload player to retry.");
        }
      });
    } else {
      // Native HLS (Safari). There is no manifest event here, so ask the element once it
      // has metadata. audioTracks is the standard answer; webkitAudioDecodedByteCount is
      // the fallback for the browsers that never implemented it.
      v.src = url;
      v.addEventListener("loadedmetadata", () => {
        const n = v.audioTracks ? v.audioTracks.length
                                : (v.webkitAudioDecodedByteCount > 0 ? 1 : 0);
        setListenAvailable(camera, n > 0);
      }, { once: true });
      hideOverlay(camera);
    }
    // The <video> has native controls, so the user can mute from there too. Mirror it
    // back, or the checkbox starts lying about what they can hear.
    v.onvolumechange = () => {
      const box = document.getElementById(`listen-${camera}`);
      if (box && !box.disabled) { box.checked = !v.muted; s.listen = !v.muted; }
    };
    scheduleSessionRefresh(camera, data.expires_in);
    watchStalls(camera);
    const cam = CAMERAS.find(c => c.id === camera) || {};
    setStatus(camera, view === "live"
      ? `live view${cam.liveView === "sub" ? " · sub stream" : ""} · not recorded`
      : "recorded stream loaded");
  } catch (e) {
    setStatus(camera, "error: " + e.message);
    showOverlay(camera, "Error loading stream.\n\nPress Reload player to retry.");
  }
}

// A player that stops advancing must never spin forever (FoundAndFixed.md #66). If the
// picture hasn't moved for STALL_SEC while the page is visible, get a new session: the stream
// may have restarted, or the session may be stuck on an old run. load() then either plays or
// says the stream isn't live. Three times in a row with no progress at all means the browser
// gets the video but doesn't show it -- say so instead of reloading forever.
const STALL_SEC = 20;
function watchStalls(camera) {
  const s = state[camera];
  const v = el(camera, "video");
  clearInterval(s.stallTimer);
  let lastT = -1, lastMove = Date.now();
  s.stallTimer = setInterval(() => {
    if (s.userStopped || !s.hls) return;
    if (v.currentTime !== lastT) {
      if (lastT >= 0) s.stallReloads = 0;
      lastT = v.currentTime; lastMove = Date.now();
      return;
    }
    // Hidden tabs may pause video on purpose; a paused player is the user's choice.
    if (document.visibilityState !== "visible" || v.paused) { lastMove = Date.now(); return; }
    if (Date.now() - lastMove < STALL_SEC * 1000) return;
    clearInterval(s.stallTimer);
    s.stallReloads = (s.stallReloads || 0) + 1;
    if (s.stallReloads > 2) {
      const cam = CAMERAS.find(c => c.id === camera) || {};
      const codec = s.view === "live" ? cam.liveVideoCodec : cam.videoCodec;
      setStatus(camera, "video arrives but doesn't play");
      showOverlay(camera, "The video reaches this browser but doesn't play.\n\n" +
        (codec === "h265" ? "This browser may not decode this camera's H.265 at this size. " : "") +
        "Press Reload player to try again.");
      return;
    }
    setStatus(camera, `no new video for ${STALL_SEC} s -- reconnecting`);
    showOverlay(camera, "Reconnecting…");
    load(camera);
  }, 5000);
}

// --- Live: watch without recording (VMS-PORT-PLAN.md D2/D3) -------------------------------------
// `live` asks the Pi to push the camera's live view (its sub stream when it records main) to the
// KVS stream "<camera>-live" until a deadline five minutes out; every `live` moves the deadline.
// So the page re-sends it every LIVE_RESEND_MS while it is visible, sends `live-stop` when the
// viewer ends Live or leaves, and the deadline is what guarantees the stream stops even when the
// laptop just closes. Nothing here records: clips come from Start.
const LIVE_RESEND_MS = 120000;
const LIVE_DEADLINE_MS = 300000;      // agent.py LIVE_DEADLINE_SEC

async function sendCmd(camera, action, keepalive = false) {
  const r = await fetch(`${API}/cmd`, {
    method: "POST", keepalive,
    headers: { Authorization: idToken, "Content-Type": "application/json" },
    body: JSON.stringify({ action, camera }),
  });
  return { ok: r.ok, data: await r.json().catch(() => ({})) };
}

function liveButton(camera) {
  const b = document.getElementById(`liveBtn-${camera}`);
  if (b) b.innerHTML = state[camera].view === "live" ? "&#9632; End live" : "&#9654; Live";
}

async function liveToggle(camera) {
  const s = state[camera];
  s.stallReloads = 0;
  clearInterval(s.liveTimer);
  s.liveTimer = null;
  if (s.view === "live") {                       // End live
    s.view = null;
    s.userStopped = true;
    s.liveWaitUntil = 0;
    teardownPlayer(camera);
    liveButton(camera);
    showOverlay(camera, "Live view ended.\n\nPress Live to watch again, or Start to record to the cloud.");
    sendCmd(camera, "live-stop").catch(() => {});   // best effort: the Pi's deadline is the guarantee
    setStatus(camera, "live view ended");
    return;
  }
  s.view = "live";
  s.userStopped = false;
  liveButton(camera);
  teardownPlayer(camera);
  setStatus(camera, "sending live...");
  showOverlay(camera, "Starting live view…\nThe Pi starts sending this camera's picture; this takes 10–20 s.");
  try {
    const { ok, data } = await sendCmd(camera, "live");
    if (!ok) {
      s.view = null;
      liveButton(camera);
      setStatus(camera, "error: " + (data.error || "live refused"));
      showOverlay(camera, "Could not start the live view: " + (data.error || "refused"));
      return;
    }
  } catch (e) {
    s.view = null;
    liveButton(camera);
    setStatus(camera, "error: " + e.message);
    showOverlay(camera, "Network error starting the live view.\n\nPress Live to try again.");
    return;
  }
  s.liveSentAt = Date.now();
  s.startedAt = performance.now();
  s.liveWaitUntil = Date.now() + 45000;
  s.liveTimer = setInterval(() => {
    if (s.view === "live" && document.visibilityState === "visible") {
      sendCmd(camera, "live").then(() => { s.liveSentAt = Date.now(); }).catch(() => {});
    }
  }, LIVE_RESEND_MS);
  clearTimeout(s.refreshTimer);
  s.refreshTimer = setTimeout(() => load(camera), 5000);
}

// Back on a hidden tab: renew at once. After more than the deadline away, the Pi has stopped the
// live view, so start it over; the player would only stall on the old session.
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  for (const [camera, s] of Object.entries(state)) {
    if (s.view !== "live") continue;
    if (Date.now() - s.liveSentAt > LIVE_DEADLINE_MS - 15000) {
      s.view = null;                       // liveToggle starts it again from "off"
      liveToggle(camera);
    } else {
      sendCmd(camera, "live").then(() => { s.liveSentAt = Date.now(); }).catch(() => {});
    }
  }
});

// Leaving the page: tell the Pi, best effort (keepalive lets the request outlive the page).
window.addEventListener("pagehide", () => {
  for (const [camera, s] of Object.entries(state)) {
    if (s.view === "live") sendCmd(camera, "live-stop", true).catch(() => {});
  }
});

async function cmd(camera, action) {
  setStatus(camera, `sending ${action}...`);
  const s = state[camera];
  s.stallReloads = 0;
  const watchingLive = s.view === "live";      // Start/Stop record; they leave a Live view alone
  if (action === "stop" && !watchingLive) {
    s.userStopped = true;
    s.liveWaitUntil = 0;
    s.view = null;
    teardownPlayer(camera);
    showOverlay(camera, "Recording to the cloud stopped.\n\nPress Live to watch, or Start to record again.");
  } else if (!watchingLive) {
    showOverlay(camera, "Starting stream…\nThis can take a few seconds.");
  }
  try {
    const r = await fetch(`${API}/cmd`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ action, camera }),
    });
    const data = await r.json();
    setStatus(camera, r.ok ? `${action} sent` : "error: " + (data.error || r.status));
    if (!r.ok) { showOverlay(camera, "Could not send " + action + ": " + (data.error || r.status)); return; }
    if (action === "start") {                  // watching Live or not: Start records either way
      s.archiveStoppedAt = 0;
      s.archiveStartedAt = performance.now();
      s.archiveWaitUntil = Date.now() + ARCHIVE_START_WINDOW_MS;
      checkArchive(camera);
    } else if (action === "stop") {
      s.archiveStoppedAt = Date.now();
      s.archiveWaitUntil = 0;
      setArchiving(camera, false);
    }
    if (action === "start" && !watchingLive) {
      // 45 s covers a producer that dies on its first try and is restarted by systemd
      // (RestartSec=5) plus a 3 s GOP, with room to spare.
      s.view = "recorded";
      s.startedAt = performance.now();
      s.liveWaitUntil = Date.now() + 45000;
      clearTimeout(s.refreshTimer);
      s.refreshTimer = setTimeout(() => load(camera), 5000);
    }
  } catch (e) {
    setStatus(camera, "error: " + e.message);
    showOverlay(camera, "Network error sending " + action + ".\n\nPress Start to try again.");
  }
}

// Writes recordingMode to the registry. The event watcher (kvs-event-watcher.service on
// the Pi) polls that registry and re-subscribes within ~60s, so a change here really does
// change recording behaviour -- see recModeHint() for the caveat the status text carries.
async function setRecordingMode(camera, mode) {
  const el = document.getElementById(`recModeStatus-${camera}`);
  el.textContent = "saving…";
  try {
    const r = await fetch(`${API}/cameras/mode`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ cameraId: camera, recordingMode: mode }),
    });
    const data = await r.json();
    if (!r.ok) { el.textContent = "error: " + (data.error || r.status); return; }
    el.textContent = `saved — ${recModeHint(mode, true)}`;
    syncClipPolling(camera, mode);
  } catch (e) {
    el.textContent = "error: " + e.message;
  }
}

// Writes audioEnabled to the registry. Unlike setRecordingMode, nothing picks this up
// while the producer runs -- see audioHint() -- so the message says so explicitly, and
// says it differently depending on whether a stream is currently up.
async function setAudio(camera, enabled) {
  const el = document.getElementById(`audioStatus-${camera}`);
  const box = document.getElementById(`audio-${camera}`);
  el.textContent = "saving…";
  try {
    const r = await fetch(`${API}/cameras/audio`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ cameraId: camera, audioEnabled: enabled }),
    });
    const data = await r.json();
    if (!r.ok) {
      // Put the box back where the server says it is, so the UI can't claim a setting
      // that was refused.
      if (box) box.checked = !enabled;
      el.textContent = "error: " + (data.error || r.status);
      return;
    }
    const target = enabled ? "sound will be recorded" : "video only";
    // userStopped starts true and is cleared by Start, so this is "did this page start
    // the stream" rather than proof of producer state -- it can be started from the
    // local admin GUI too. Phrased as a prompt, not an assertion, for that reason.
    el.textContent = state[camera] && !state[camera].userStopped
      ? `Saved — ${target} from the next Start. Press Stop then Start to apply it now.`
      : `Saved — ${target} from the next Start.`;
  } catch (e) {
    if (box) box.checked = !enabled;
    el.textContent = "error: " + e.message;
  }
}

// Unlike the audio flag, this one needs no restart: the supervisor on the Pi re-reads the
// registry every 60s and arms or disarms MediaMTX recording in place. What it cannot do
// is buffer a camera whose producer is stopped -- with no producer there is no cloud
// stream to protect -- which is why the note says "only while this camera is streaming".
async function setOutageBuffer(camera, secs) {
  const el = document.getElementById(`outageStatus-${camera}`);
  const sel = document.getElementById(`outage-${camera}`);
  const previous = state[camera] ? state[camera].outageBufferSec : 0;
  el.textContent = "saving…";
  try {
    const r = await fetch(`${API}/cameras/outage-buffer`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ cameraId: camera, outageBufferSec: Number(secs) }),
    });
    const data = await r.json();
    if (!r.ok) {
      if (sel) sel.value = String(previous);   // never show a setting the server refused
      el.textContent = "error: " + (data.error || r.status);
      return;
    }
    if (state[camera]) state[camera].outageBufferSec = Number(secs);
    el.textContent = `Saved — ${outageHint(secs)}. Takes effect within a minute.`;
  } catch (e) {
    if (sel) sel.value = String(previous);
    el.textContent = "error: " + e.message;
  }
}

async function setIrMode(camera, mode) {
  const statusEl = document.getElementById(`irStatus-${camera}`);
  statusEl.textContent = `setting ${mode}...`;
  try {
    const r = await fetch(`${API}/cmd`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ action: "ir", camera, mode }),
    });
    const data = await r.json();
    statusEl.textContent = r.ok ? `IR mode: ${mode}` : "error: " + (data.error || r.status);
  } catch (e) {
    statusEl.textContent = "error: " + e.message;
  }
}

// --- Start Recording needs Start running (FoundAndFixed.md #83) ---------------------------------
// Start Recording sends no video of its own: Stop Recording asks the cloud to cut that time span
// out of the camera's archive (record_clip.py), which has footage only while Start runs. So the
// button is on only while footage is reaching the archive, as KVS itself says: the recorded
// stream's /hls answers 200 while it holds a fragment from the last 30 s, 503 when it doesn't --
// the answer the player gets too. Asked at sign-in, every ARCHIVE_POLL_MS while the page is
// visible (a Start or Stop from the admin GUI or another browser shows up that way), on coming
// back to the tab, and every ARCHIVE_POLL_FAST_MS through the start window after this page's
// Start -- with since=, as load() does, so the previous run's last fragment doesn't count
// (FoundAndFixed.md #66). After this page's own Stop, KVS still calls the stream live for up to
// 30 s, so the button goes off at once and a 200 is ignored for ARCHIVE_STOP_GRACE_MS. A
// recording in progress can always be stopped: whatever footage its time span holds is saved.
const ARCHIVE_POLL_MS = 30000;
const ARCHIVE_POLL_FAST_MS = 5000;
const ARCHIVE_START_WINDOW_MS = 45000;   // cmd()'s start window
const ARCHIVE_STOP_GRACE_MS = 35000;     // KVS's 30 s "live" window, plus slack

function setArchiving(camera, on) {
  const s = state[camera];
  s.archiving = on;
  const off = !on && !s.recording;
  el(camera, "recordBtn").disabled = off;
  el(camera, "recordHint").style.display = off ? "" : "none";
}

// One loop per camera: each call takes over the timer, and an answer that a later call has
// overtaken is dropped (archiveSeq), so a slow probe from before Start can't switch it back off.
async function checkArchive(camera) {
  const s = state[camera];
  clearTimeout(s.archiveTimer);
  const seq = ++s.archiveSeq;
  if (document.visibilityState === "visible") {
    const since = Date.now() < s.archiveWaitUntil
      ? `&since=${Math.max(1, (performance.now() - s.archiveStartedAt) / 1000).toFixed(1)}` : "";
    try {
      const r = await fetch(`${API}/hls?stream=${camera}&view=recorded${since}`,
                            { headers: { Authorization: idToken } });
      if (seq !== s.archiveSeq) return;
      // Anything else (an expired sign-in, a Lambda error) says nothing about the stream.
      if (r.status === 200 || r.status === 503) {
        setArchiving(camera, r.ok && Date.now() - s.archiveStoppedAt > ARCHIVE_STOP_GRACE_MS);
      }
    } catch (e) {
      if (seq !== s.archiveSeq) return;        // transient; the next tick asks again
    }
  }
  s.archiveTimer = setTimeout(() => checkArchive(camera),
    Date.now() < s.archiveWaitUntil ? ARCHIVE_POLL_FAST_MS : ARCHIVE_POLL_MS);
}

document.addEventListener("visibilitychange", () => {
  if (document.visibilityState !== "visible") return;
  for (const camera of Object.keys(state)) checkArchive(camera);
});

function toggleRecording(camera) {
  const s = state[camera];
  if (s.recording) stopRecording(camera);
  else if (s.archiving) startRecording(camera);
}

function startRecording(camera) {
  const s = state[camera];
  s.recording = true;
  s.recordingStartTs = new Date();
  const btn = document.getElementById(`recordBtn-${camera}`);
  btn.textContent = "■ Stop Recording";
  btn.style.background = "#c0392b";
  btn.style.color = "#fff";

  const statusEl = document.getElementById(`recordStatus-${camera}`);
  s.recordingTimer = setInterval(() => {
    const secs = Math.floor((new Date() - s.recordingStartTs) / 1000);
    statusEl.textContent = `Recording… ${secs}s`;
  }, 1000);
}

async function stopRecording(camera) {
  const s = state[camera];
  s.recording = false;
  clearInterval(s.recordingTimer);
  const endTs = new Date();
  const btn = document.getElementById(`recordBtn-${camera}`);
  const statusEl = document.getElementById(`recordStatus-${camera}`);
  btn.textContent = "● Start Recording";
  btn.style.background = "";
  btn.style.color = "";
  setArchiving(camera, s.archiving);   // off again if Start stopped during the recording
  statusEl.textContent = "Saving recording…";

  try {
    const r = await fetch(`${API}/clips/record`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({
        stream: camera,
        startTs: s.recordingStartTs.toISOString(),
        endTs: endTs.toISOString(),
      }),
    });
    const data = await r.json();
    if (!r.ok) {
      statusEl.textContent = "Error saving recording: " + (data.error || r.status);
      return;
    }
    // A recording that spans a codec switch comes back as one clip per codec: KVS cannot
    // make a single clip across the switch (record_clip.py, codec_windows).
    statusEl.textContent = (data.keys && data.keys.length > 1)
      ? `Recording saved as ${data.keys.length} clips — the camera's video codec changed during it.`
      : "Recording saved.";
    loadClips(camera, "first");   // the new clip is the newest, on the first page
  } catch (e) {
    statusEl.textContent = "Network error saving recording: " + e.message;
  }
}

// Shows one page of CLIPS_PAGE_SIZE clips, newest first. `page` is a page number, "first"
// (newest), "last" (oldest), "older", "newer", or "current" (reload the page being viewed,
// e.g. after a tier change or a delete). Every response carries the camera's current page
// count and clip total, so the page numbers follow deletes and new clips on each load; a
// page past the end comes back as the last page (list_clips.py).
async function loadClips(camera, page = "current") {
  const s = state[camera];
  const list = document.getElementById(`clipsList-${camera}`);
  const target = page === "first" ? 1
    : page === "last" ? "last"
    : page === "older" ? s.page + 1
    : page === "newer" ? Math.max(1, s.page - 1)
    : page === "current" ? s.page
    : page;
  // Only the latest request may render: a slow response must not overwrite a newer page.
  const req = s.clipsReq = (s.clipsReq || 0) + 1;
  s.pageLoading = true;
  renderClipsPager(camera);
  list.innerHTML = "<li>Loading…</li>";
  try {
    const q = `camera=${camera}&limit=${CLIPS_PAGE_SIZE}&page=${target}`;
    const r = await fetch(`${API}/clips?${q}`, { headers: { Authorization: idToken } });
    const data = await r.json();
    if (req !== s.clipsReq) return;
    s.pageLoading = false;
    if (!r.ok) { list.innerHTML = `<li>Error: ${data.error || r.status}</li>`; renderClipsPager(camera); return; }
    // taken from the response only, so a failed load leaves the user where they were;
    // a list-clips that predates page numbers returns none -- one page, then
    s.page = data.page || 1;
    s.pages = data.pages || 1;
    s.total = data.total ?? data.clips.length;
    renderClipsPager(camera);
    if (s.page === 1) {
      // remember the newest clip so checkForNewClips() can spot arrivals, and clear any
      // pending hint since the newest page is now on screen. An older page shows neither.
      s.renderedLatest = data.clips.length ? data.clips[0].startTs : null;
      const alertEl = document.getElementById(`clipsAlert-${camera}`);
      if (alertEl) { alertEl.textContent = ""; alertEl.style.display = "none"; }
    }

    if (data.clips.length === 0) { list.innerHTML = "<li>No clips yet.</li>"; return; }

    list.innerHTML = "";
    // slice: a list-clips that predates paging ignores `limit` and returns up to 50
    for (const clip of data.clips.slice(0, CLIPS_PAGE_SIZE)) {
      const li = document.createElement("li");
      const when = new Date(clip.startTs).toLocaleString();
      const tierClass = "tier-" + clip.tier;
      const tierText = TIER_LABEL[clip.tier] || clip.tier;
      const restoreNote = clip.restoring ? " (restoring…)" : "";
      const duration = clip.durationSec != null ? formatDuration(clip.durationSec) : "duration unknown";
      li.innerHTML = `
        <span class="tier-badge ${tierClass}">${tierText}${restoreNote}</span>
        <span class="clip-meta">${when}
          <span class="clip-duration">· ${duration}${clipCodecHtml(clip)}</span>
          <span class="clip-labels">${(clip.labels || []).join(", ")}</span>
        </span>
        <select class="tier-select">
          <option value="STANDARD">Standard</option>
          <option value="STANDARD_IA">Standard-IA</option>
          <option value="DEEP_ARCHIVE">Deep Archive</option>
        </select>
        <button class="tier-apply-btn">Apply</button>
        <button class="play-btn">Play</button>
        <button class="delete-btn" style="background:#c0392b; color:#fff">Delete</button>
        <span class="tier-apply-status"></span>`;
      li.querySelector(".tier-select").value =
        (clip.tier === "GLACIER" ? "DEEP_ARCHIVE" : clip.tier) || "STANDARD";
      li.querySelector(".tier-apply-btn").onclick =
        () => setClipTier(clip.s3Key, li.querySelector(".tier-select").value, li, camera);
      li.querySelector(".delete-btn").onclick =
        () => deleteClip(clip.s3Key, clip.startTs, when, li, camera);
      li.querySelector(".play-btn").onclick = () => playClip(clip.s3Key);
      list.appendChild(li);
    }
  } catch (e) {
    if (req !== s.clipsReq) return;
    s.pageLoading = false;
    renderClipsPager(camera);
    list.innerHTML = `<li>Error: ${e.message}</li>`;
  }
}

// The page numbers to offer: all of them up to 9 pages, else the first, the last and two
// either side of the current one, with null marking each gap ("…").
function clipPageNumbers(page, pages) {
  if (pages <= 9) return Array.from({ length: pages }, (_, i) => i + 1);
  const shown = [...new Set([1, page - 2, page - 1, page, page + 1, page + 2, pages])]
    .filter(n => n >= 1 && n <= pages).sort((a, b) => a - b);
  const out = [];
  shown.forEach((n, i) => { if (i && n - shown[i - 1] > 1) out.push(null); out.push(n); });
  return out;
}

function renderClipsPager(camera) {
  const s = state[camera];
  const pager = document.getElementById(`clipsPager-${camera}`);
  if (!pager) return;
  const { page, pages, pageLoading: busy } = s;
  pager.classList.toggle("hidden", pages <= 1);
  const nums = pager.querySelector(".pg-numbers");
  nums.innerHTML = "";
  for (const n of clipPageNumbers(page, pages)) {
    if (n === null) {
      nums.insertAdjacentHTML("beforeend", '<span class="pg-gap">…</span>');
      continue;
    }
    const b = document.createElement("button");
    b.className = "pg-num" + (n === page ? " pg-current" : "");
    b.textContent = n;
    b.disabled = busy || n === page;
    if (n === page) b.setAttribute("aria-current", "page");
    b.onclick = () => loadClips(camera, n);
    nums.appendChild(b);
  }
  pager.querySelector(".clips-page-label").textContent =
    `${s.total} clip${s.total === 1 ? "" : "s"}`;
  pager.querySelector(".pg-first").disabled = busy || page === 1;
  pager.querySelector(".pg-newer").disabled = busy || page === 1;
  pager.querySelector(".pg-older").disabled = busy || page === pages;
  pager.querySelector(".pg-last").disabled = busy || page === pages;
}

async function setClipTier(s3Key, tier, li, camera) {
  const statusEl = li.querySelector(".tier-apply-status");
  statusEl.textContent = "Applying…";
  try {
    const r = await fetch(`${API}/clips/tier`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ s3Key, tier }),
    });
    const data = await r.json();
    if (!r.ok) {
      statusEl.textContent = data.error || `Error (${r.status})`;
      return;
    }
    statusEl.textContent = "Done.";
    loadClips(camera, "current");   // stay on the page being viewed
  } catch (e) {
    statusEl.textContent = "Network error: " + e.message;
  }
}

async function deleteClip(s3Key, startTs, when, li, camera) {
  if (!confirm(`Delete the clip from ${when}?\n\nThis cannot be undone.`)) return;

  const statusEl = li.querySelector(".tier-apply-status");
  statusEl.textContent = "Deleting…";
  try {
    const r = await fetch(`${API}/clips/delete`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ s3Key, startTs }),
    });
    const data = await r.json();
    if (!r.ok) {
      statusEl.textContent = "Error: " + (data.error || r.status);
      return;
    }
    closeClipPlayer();
    li.remove();
    // Reload the page: it refills from the older clips, the page count and total follow,
    // and a page that no longer exists comes back as the new last page (loadClips).
    loadClips(camera, "current");
  } catch (e) {
    statusEl.textContent = "Network error: " + e.message;
  }
}

// One shared player for saved clips, regardless of which camera panel's Play button
// was pressed -- only one clip is ever being reviewed at a time, so a per-camera
// player would just be two empty players sitting around.
async function playClip(s3Key) {
  const section = document.getElementById("clipPlayerSection");
  const player = document.getElementById("clipPlayer");
  const statusEl = document.getElementById("clipStatus");
  section.style.display = "block";
  player.onerror = null;
  player.pause(); player.removeAttribute("src"); player.load();
  statusEl.textContent = "Loading clip…";
  section.scrollIntoView({ behavior: "smooth" });

  try {
    const r = await fetch(`${API}/clips/play`, {
      method: "POST",
      headers: { Authorization: idToken, "Content-Type": "application/json" },
      body: JSON.stringify({ s3Key }),
    });
    const data = await r.json();
    if (!r.ok && r.status !== 202) {
      statusEl.textContent = "Error: " + (data.error || r.status);
      return;
    }
    if (data.status === "ready") {
      // A browser without an H.265 decoder fails an H.265 clip with an unreadable error
      // (Firefox: NS_ERROR_DOM_MEDIA_METADATA_ERR; Edge: "no supported source"). The clip
      // list does not record the codec, so the hint is conditional on this browser
      // lacking H.265, not on knowing that this clip is H.265.
      player.onerror = () => {
        if (!hevcSupport().clips) {
          statusEl.innerHTML = "This clip could not be played. If this camera records in " +
            "H.265, this browser can't decode it. " + hevcHelpHtml();
          showHevcHelp();
        } else {
          statusEl.textContent = "This clip could not be played (media error " +
            (player.error ? player.error.code : "?") + ").";
        }
      };
      player.src = data.url;
      statusEl.textContent = "";
      player.play().catch((e) => {
        // Only an autoplay refusal means "fine, just press play". Anything else (e.g.
        // NotSupportedError) is reported by onerror above -- saying "Loaded" there was
        // simply wrong for a clip the browser cannot decode.
        if (e.name === "NotAllowedError") {
          statusEl.textContent = "Loaded -- press the player's play button to watch.";
        }
      });
    } else if (data.status === "restore_requested") {
      statusEl.textContent = `This clip is in Deep Archive and wasn't readable directly. ` +
        `A restore has been requested -- check back in about ${data.eta_hours} hours ` +
        `and press Play again.`;
    } else if (data.status === "restoring") {
      statusEl.textContent = `Restore already in progress -- check back in about ` +
        `${data.eta_hours} hours and press Play again.`;
    }
  } catch (e) {
    statusEl.textContent = "Network error: " + e.message;
  }
}

function closeClipPlayer() {
  const player = document.getElementById("clipPlayer");
  player.onerror = null;
  player.pause();
  player.removeAttribute("src");
  player.load();
  document.getElementById("clipStatus").textContent = "";
  document.getElementById("clipPlayerSection").style.display = "none";
}

document.getElementById("login").style.display = "block";
</script>
