# Runs the pytest suite on every push and pull request (PYTEST.md, step 7), and tests_db/ against a
# throwaway PostgreSQL 18 container (PYTEST.md, tests_db).
#
# No AWS credentials, secrets or OIDC role, on purpose: every test fakes AWS, and tests/conftest.py
# blocks the network and gives boto3 fake keys, so there is nothing here that could reach the
# account shared with VMS. Nothing is deployed from here either -- deploys stay cloud/deploy.sh,
# run by hand (CLAUDE.md).
name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    # x86, while the Pi is arm64: the code under test is plain Python, and every package in
    # requirements.txt has wheels for both.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"     # the Pi's (Raspberry Pi OS trixie) and the Lambdas' runtime
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt

      - name: Install the packages venv-adapter has
        run: python -m pip install -r requirements.txt -r requirements-test.txt

      - name: Run the tests
        run: python -m pytest

  db:
    # tests_db/: the directory's SQL (cloud/db/migrations/) and vsz-db-admin's bootstrap against a
    # real PostgreSQL 18 -- the RDS instance's major version -- in a throwaway service container.
    # Still no AWS: the container is the only server these tests know (DEALER-PANEL-PLAN.md 1.4).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-only-throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-test.txt
            cloud/layers/vsz-pg/requirements.txt

      - name: Install the packages, and pg8000 exactly as the vsz-pg layer has it
        run: |
          python -m pip install -r requirements.txt -r requirements-test.txt
          python -m pip install --require-hashes --no-deps --only-binary=:all: -r cloud/layers/vsz-pg/requirements.txt

      - name: Run tests_db
        env:
          VSZ_TEST_PG_DSN: postgresql://postgres:ci-only-throwaway@127.0.0.1:5432/postgres
        run: python -m pytest tests_db
