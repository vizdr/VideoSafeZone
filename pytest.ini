# pytest configuration (PYTEST.md, step 2). Run from the repository root:
#   venv-adapter/bin/python -m pytest
[pytest]
testpaths = tests
# adapter/ so tests import its modules by name, as the services do; tests/ for loaders.py.
pythonpath = adapter tests
# importlib: test files in different folders may share a name, and no __init__.py is needed.
addopts = -ra --strict-markers --strict-config --import-mode=importlib
xfail_strict = true
